<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <style>
        body { font-family: Arial; margin: 30px; background: #f4f7f6; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; cursor: pointer; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #007bff; color: white; }
        .delete-btn { background: #dc3545; width: auto; padding: 3px 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Management System (Django + JS)</h2>
        <form id="studentForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="text" id="course" placeholder="Course" required>
            <button type="submit">Add Student</button>
        </form>

        <h3>Records</h3>
        <table>
            <thead>
                <tr><th>Name</th><th>Email</th><th>Course</th><th>Action</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api/students/';

        async function fetchStudents() {
            const res = await fetch(API_URL);
            const data = await res.json();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach(s => {
                tbody.innerHTML += `<tr>
                    <td>${s.name}</td><td>${s.email}</td><td>${s.course}</td>
                    <td><button class="delete-btn" onclick="deleteStudent(${s.id})">Delete</button></td>
                </tr>`;
            });
        }

        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const student = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                course: document.getElementById('course').value
            };
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(student)
            });
            e.target.reset();
            fetchStudents();
        });

        async function deleteStudent(id) {
            if(confirm('Delete record?')) {
                await fetch(`${API_URL}${id}/`, { method: 'DELETE' });
                fetchStudents();
            }
        }

        fetchStudents();
    </script>
</body>
</html>
